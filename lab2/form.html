<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма реєстрації</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Реєстрація</h1>
        <form id="registrationForm">
            <!-- Поле для імені -->
            <div class="form-group">
                <label for="name">Ім'я *</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Введіть ваше ім'я"
                    autocomplete="name">
                <div class="error-message" id="nameError">Будь ласка, введіть ім'я</div>
            </div>

            <!-- Поле для email -->
            <div class="form-group">
                <label for="email">Email *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="example@mail.com"
                    autocomplete="email">
                <div class="error-message" id="emailError">Введіть коректний email</div>
            </div>

            <!-- Поле для пароля -->
            <div class="form-group">
                <label for="password">Пароль *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Мінімум 6 символів"
                    autocomplete="new-password">
                <div class="error-message" id="passwordError">Пароль має містити мінімум 6 символів</div>
            </div>

            <!-- Поле для повтору пароля -->
            <div class="form-group">
                <label for="confirmPassword">Повтор пароля *</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Повторіть пароль"
                    autocomplete="new-password">
                <div class="error-message" id="confirmPasswordError">Паролі не збігаються</div>
            </div>

            <!-- Кнопка відправки -->
            <button type="submit">Надіслати</button>
        </form>

        <!-- Повідомлення про успіх -->
        <div class="success-message" id="successMessage">
            ✓ Форма успішно відправлена!
        </div>
    </div>

    <!-- Підключення JavaScript -->
    <script src="script.js"></script>
</body>
</html>
